<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pool study · Surface lab</title>
<link rel="stylesheet" href="lab.css?v=14">
<style>
  .study-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .study-row select { font: inherit; padding: 8px 10px; border: 1px solid #b7c2b0; border-radius: 6px; background: #fbf9ea; color: inherit; min-height: 42px; }
  .study-row .switches { flex-wrap: wrap; }
  #stats { font-size: 12px; color: #526858; margin-top: 10px; line-height: 1.5; min-height: 2.6em; }
  .stage { position: relative; }
</style>
<main>
  <header><h1>Pool study</h1><a class="tag" href="index.html">Surface lab ↗</a></header>
  <div class="study-row">
    <label>Piscine <select id="pool" aria-label="Piscine"></select></label>
    <label>Eau <select id="state" aria-label="État de l'eau"><option value="calme">calme</option><option value="traité">traité</option><option value="sauvage">sauvage</option><option value="critique">critique</option></select></label>
    <div class="actions">
      <button type="button" id="walk" aria-pressed="true">Pause tournée</button>
      <button type="button" id="wear">Effacer l'usure</button>
    </div>
  </div>
  <div class="study-row">
    <div class="switches" role="group" aria-label="Météo">
      <button type="button" data-weather="sec" aria-pressed="true">Sec</button>
      <button type="button" data-weather="brise" aria-pressed="false">Brise</button>
      <button type="button" data-weather="pluie" aria-pressed="false">Pluie</button>
      <button type="button" data-weather="tempete" aria-pressed="false">Tempête</button>
      <button type="button" data-weather="gel" aria-pressed="false">Gel</button>
      <button type="button" data-weather="lacanau" aria-pressed="false">Météo Lacanau</button>
    </div>
    <div class="switches" role="group" aria-label="Heure">
      <button type="button" data-hour="manual" aria-pressed="true">Jour</button>
      <button type="button" data-hour="7.5" aria-pressed="false">Matin</button>
      <button type="button" data-hour="20.5" aria-pressed="false">Soir</button>
      <button type="button" data-hour="23" aria-pressed="false">Nuit</button>
    </div>
  </div>
  <div class="stage">
    <canvas id="terrain" width="1024" height="768" tabindex="0" aria-label="Une piscine sur le terrain vivant. Touche pour marcher.">La piscine sur le terrain vivant.</canvas>
    <div id="status">Chargement…</div>
  </div>
  <div id="stats"></div>
  <footer>Le sol vient du surface lab (herbe, sable, terre, gravier, météo, usure). La terrasse, le bassin, les arbres et le local viennent des cartes de piscines et du kit de zone. Les villas sont un toit provisoire.</footer>
</main>
